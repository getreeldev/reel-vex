name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  # Make this workflow callable from release.yml so the release flow shares the
  # same jobs / UI boxes as the CI on push/PR.
  workflow_call: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: go build
        run: go build ./...

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: go vet
        run: go vet ./...
      - name: go vet (integration tag)
        run: go vet -tags integration ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          # The runner's cached toolchain can lag a patch release behind, and
          # govulncheck scans the stdlib at the toolchain's own version — a
          # stale cache fails the scan on already-fixed stdlib CVEs.
          check-latest: true
      # Scan the dependency tree for known CVEs (matters most for the
      # decompression libs — xz/zstd/bzip2 — used in the ingest feed paths).
      # Run as a tool so it stays out of go.mod.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # TestPG needs the database the integration job has; under CI=true it
      # fails without one rather than skip, so it is skipped here by name.
      - name: go test ./...
        run: go test -count=1 -skip '^TestPG$' ./...

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # TestPG and test/integration both truncate the same tables, so TestPG
      # runs in a step of its own first.
      - name: TestPG
        env:
          REEL_VEX_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 -v -run '^TestPG$' ./pkg/db/postgres/
      # test/integration and test/acceptance; the acceptance suite creates and
      # drops a database of its own, so the two packages may run in parallel.
      - name: Integration tests
        env:
          REEL_VEX_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -tags integration -count=1 -v ./test/...
