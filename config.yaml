adapters:
  - type: csaf
    id: redhat
    name: Red Hat
    url: https://security.access.redhat.com/data/csaf/v2/provider-metadata.json
  - type: csaf
    id: suse
    name: SUSE
    url: https://www.suse.com/.well-known/csaf/provider-metadata.json
  # Red Hat OVAL: fills the EUS/AUS/E4S/SAP/HA/NFV coverage gap that CSAF
  # intentionally leaves (see SECDATA-1181). One adapter per OVAL file;
  # add more entries here as coverage needs grow — no code changes required.
  - type: redhat-oval
    id: redhat-oval-rhel-9.6-eus
    url: https://security.access.redhat.com/data/oval/v2/RHEL9/rhel-9.6-eus.oval.xml.bz2
  # Canonical OpenVEX: single tarball at vex-all.tar.xz containing per-CVE
  # OpenVEX 0.2.0 documents. Strict superset of the USN-derived OVAL feeds
  # below — covers pre-USN triage state (`not_affected`,
  # `under_investigation`) that OVAL never emits. ESM-track distro qualifier
  # values are normalised to scanner-convention `ubuntu-<version>` in the
  # adapter; no external alias file needed.
  - type: ubuntu-vex
    id: ubuntu-vex
    url: https://security-metadata.canonical.com/vex/vex-all.tar.xz
  # Ubuntu OVAL: per-release USN feeds (the main, non-OCI variants).
  # DEPRECATED: superseded by ubuntu-vex; removal queued for v0.5.0.
  # Both run during the soak window so we can verify the OpenVEX feed has
  # parity with the OVAL feeds before retiring them. The two emit different
  # source_format values (`oval` vs `openvex`); the statements PK includes
  # source_format so they coexist by design.
  #
  # We deliberately do not use Canonical's OCI-flavoured feeds
  # (oci.com.ubuntu.<release>...). Those scope to container-relevant
  # packages by stripping kernel/HWE/driver content — a scoping decision
  # that belongs to the scanner, not to us. vex.getreel.dev is a general
  # VEX hub; a consumer scanning a bare-metal Ubuntu host or a VM
  # filesystem should get the same coverage as one scanning a container.
  - type: ubuntu-oval
    id: ubuntu-oval-noble
    name: Ubuntu 24.04 LTS
    url: https://security-metadata.canonical.com/oval/com.ubuntu.noble.usn.oval.xml.bz2
  - type: ubuntu-oval
    id: ubuntu-oval-jammy
    name: Ubuntu 22.04 LTS
    url: https://security-metadata.canonical.com/oval/com.ubuntu.jammy.usn.oval.xml.bz2
  - type: ubuntu-oval
    id: ubuntu-oval-focal
    name: Ubuntu 20.04 LTS
    url: https://security-metadata.canonical.com/oval/com.ubuntu.focal.usn.oval.xml.bz2
  # Debian Security Tracker OVAL: per-release feeds covering both DSAs
  # (class=patch) and per-CVE records (class=vulnerability) with fixed
  # version bounds. One adapter per supported release; add new entries
  # here as Debian ships new stable releases.
  - type: debian-oval
    id: debian-oval-bookworm
    name: Debian 12 (bookworm)
    url: https://www.debian.org/security/oval/oval-definitions-bookworm.xml.bz2
  - type: debian-oval
    id: debian-oval-bullseye
    name: Debian 11 (bullseye)
    url: https://www.debian.org/security/oval/oval-definitions-bullseye.xml.bz2
  - type: debian-oval
    id: debian-oval-trixie
    name: Debian 13 (trixie)
    url: https://www.debian.org/security/oval/oval-definitions-trixie.xml.bz2
  # SUSE Rancher VEX Hub (contributed via issue #1): not_affected suppressions
  # for SUSE cloud-native product images (Rancher, RKE2, K3s, Harvester,
  # Longhorn). The URL points at the repo's index.json manifest; the adapter
  # walks it to the small per-package OpenVEX files (since v0.6.4 — the old
  # consolidated reports/rancher.openvex.json is Git-LFS-backed and must NOT be
  # used). Statements are subcomponent-scoped: the matchable package rides in
  # subcomponents[] and becomes the row's product_id, while the product
  # image/module is stored as the row's `scope` and gated at query time (a
  # verdict scoped to one image never suppresses the same package elsewhere).
  # Non-CVE-named statements (~3%, mostly SUSE-SU advisories with no CVE alias)
  # are skipped — we key and serve by CVE. Vendor "rancher", distinct from
  # SUSE CSAF's "suse".
  - type: rancher-vex
    id: rancher-vex
    name: SUSE Rancher (OpenVEX)
    url: https://raw.githubusercontent.com/rancher/vexhub/refs/heads/main/index.json
  # Alpine Linux secdb: Alpine's own security database, one tiny uncompressed
  # JSON per (branch × repository). secfixes maps fixed apk versions to advisory
  # ids (version key "0" = known-affected/no-fix). Only CVE-prefixed ids are
  # ingested; Alpine's non-CVE advisories (XSA-/ALPINE-/DW-) are skipped (we key
  # by CVE). Statements are stored branch-scoped as
  # pkg:apk/alpine/<name>?distro=alpine-<major.minor>, so the same package+CVE on
  # different branches stays distinct; the resolver normalizes a scanner's apk
  # distro qualifier to match. One adapter per branch×repo; there is no
  # latest-stable alias, so name each branch. Add new entries as Alpine ships new
  # releases / retires old branches.
  - type: alpine-secdb
    id: alpine-secdb-v3.23-main
    name: Alpine Linux 3.23
    url: https://secdb.alpinelinux.org/v3.23/main.json
  - type: alpine-secdb
    id: alpine-secdb-v3.23-community
    name: Alpine Linux 3.23
    url: https://secdb.alpinelinux.org/v3.23/community.json
  - type: alpine-secdb
    id: alpine-secdb-v3.22-main
    name: Alpine Linux 3.22
    url: https://secdb.alpinelinux.org/v3.22/main.json
  - type: alpine-secdb
    id: alpine-secdb-v3.22-community
    name: Alpine Linux 3.22
    url: https://secdb.alpinelinux.org/v3.22/community.json
  - type: alpine-secdb
    id: alpine-secdb-v3.21-main
    name: Alpine Linux 3.21
    url: https://secdb.alpinelinux.org/v3.21/main.json
  - type: alpine-secdb
    id: alpine-secdb-v3.21-community
    name: Alpine Linux 3.21
    url: https://secdb.alpinelinux.org/v3.21/community.json
  - type: alpine-secdb
    id: alpine-secdb-v3.20-main
    name: Alpine Linux 3.20
    url: https://secdb.alpinelinux.org/v3.20/main.json
  - type: alpine-secdb
    id: alpine-secdb-v3.20-community
    name: Alpine Linux 3.20
    url: https://secdb.alpinelinux.org/v3.20/community.json
  - type: alpine-secdb
    id: alpine-secdb-v3.19-main
    name: Alpine Linux 3.19
    url: https://secdb.alpinelinux.org/v3.19/main.json
  - type: alpine-secdb
    id: alpine-secdb-v3.19-community
    name: Alpine Linux 3.19
    url: https://secdb.alpinelinux.org/v3.19/community.json
  # Amazon Linux Security Advisories (ALAS). Amazon ships no OVAL/CSAF; the
  # data lives in each yum repo's repodata/updateinfo.xml, reached via a
  # mirror.list -> repomd.xml -> updateinfo.xml.gz crawl (re-resolved every
  # run — the mirror base embeds a content GUID that rotates). One adapter per
  # distro; the distro (amzn2 / al2023) is inferred from the mirror.list URL,
  # so the config is just type/id/url. Statements are package-level "fixed",
  # keyed on pkg:rpm/amazon/<name>?distro=amazon-<major>. SCOPE (v1): core
  # repos only — the AL2 "Extras" repos (amzn2extra-*) and EOL AL1 are not
  # crawled (see the package doc comment).
  - type: amazon-alas
    id: amazon-alas-2
    name: Amazon Linux 2
    url: https://cdn.amazonlinux.com/2/core/latest/x86_64/mirror.list
  - type: amazon-alas
    id: amazon-alas-2023
    name: Amazon Linux 2023
    url: https://cdn.amazonlinux.com/al2023/core/mirrors/latest/x86_64/mirror.list
  # AlmaLinux errata OVAL: one bz2 per major (RHEL rebuild; ALSA errata). Parsed
  # by oval-to-vex FromAlmaLinuxOVAL into package-level "fixed" statements; the
  # release major is read from the alsa-<N> filename and becomes
  # ?distro=almalinux-<N>. Emitted under both pkg:rpm/almalinux/ and
  # pkg:rpm/alma/ (scanner namespace drift); the resolver normalizes a scanner's
  # alma-<N>.<m> / almalinux-<N>.<m> query distro to almalinux-<N>.
  - type: almalinux-oval
    id: almalinux-oval-9
    url: https://security.almalinux.org/oval/org.almalinux.alsa-9.xml.bz2
  - type: almalinux-oval
    id: almalinux-oval-8
    url: https://security.almalinux.org/oval/org.almalinux.alsa-8.xml.bz2
  - type: almalinux-oval
    id: almalinux-oval-10
    url: https://security.almalinux.org/oval/org.almalinux.alsa-10.xml.bz2
  # Oracle Linux errata OVAL: one bz2 per release (ELSA). Parsed by oval-to-vex
  # FromOracleOVAL; the release major is read per-definition from the
  # <platform>Oracle Linux N</platform> tag (a single ELSA can target several
  # majors). Keyed pkg:rpm/oracle/<name>?distro=oracle-<N> — matches Trivy's
  # oracle-<N> directly. Ksplice variants are skipped in v1.
  - type: oracle-oval
    id: oracle-oval-ol9
    url: https://linux.oracle.com/security/oval/com.oracle.elsa-ol9.xml.bz2
  - type: oracle-oval
    id: oracle-oval-ol8
    url: https://linux.oracle.com/security/oval/com.oracle.elsa-ol8.xml.bz2
  - type: oracle-oval
    id: oracle-oval-ol10
    url: https://linux.oracle.com/security/oval/com.oracle.elsa-ol10.xml.bz2

aliases:
  - type: redhat-repository-to-cpe
    id: redhat
    # Uses the default URL (security.access.redhat.com/data/metrics/repository-to-cpe.json).
    # Override via `url:` if you mirror the file internally.
